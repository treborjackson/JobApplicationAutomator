version: "3.9"
services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: jobapplicator
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  backend:
    build: ./backend
    env_file: .env
    ports:
      - "8000:8000"
    depends_on:
      - db
    volumes:
      - ./uploads:/app/uploads

  web:
    build: ./apps/web
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  pgdata:
